modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL 2.1"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_vendor}"
description = "A Minecraft mod and library for adding the Chromium web browser into the game (Minecraft Chromium Embedded Framework)."
logoFile = "icon.png"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"
